[project]
name = "byom-video-workers"
version = "0.2.0"
description = "Python workers for BYOM Video — transcription, LangGraph agent sidecar"
requires-python = ">=3.10"

[project.optional-dependencies]
transcribe = ["faster-whisper"]
graph = ["langgraph>=0.2.0", "langchain-core>=0.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["byom_video_workers*", "openvfx_agent_graph*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
