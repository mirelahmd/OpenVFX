name: release

# Publishes OpenVFX release archives when a version tag is pushed.
#
# Each archive contains the Go CLI and the Python agent sidecar, so the
# installer can set up a working Creative Director without a repo checkout.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.2.0). Builds artifacts without publishing."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: go test ./...

      - name: Build release archives
        run: scripts/build-release.sh "${{ steps.version.outputs.value }}"

      - name: Verify archive contents
        # A release whose sidecar is missing would install a CLI with no agent.
        run: |
          set -eu
          archive="dist/openvfx_${{ steps.version.outputs.value }}_linux_amd64.tar.gz"
          tar -tzf "$archive" | grep -q 'bin/openvfx$' \
            || { echo "archive is missing bin/openvfx" >&2; exit 1; }
          tar -tzf "$archive" | grep -q 'share/openvfx/workers/openvfx_agent_graph/creative/graph.py$' \
            || { echo "archive is missing the Creative Director" >&2; exit 1; }
          ls -la dist
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: openvfx-${{ steps.version.outputs.value }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
