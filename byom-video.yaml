project:
  name: byom-video-project

python:
  interpreter: .venv/bin/python

transcription:
  enabled: true
  model_size: tiny

captions:
  enabled: true

chunks:
  enabled: true
  target_seconds: 30
  max_gap_seconds: 2.0

highlights:
  enabled: true
  top_k: 10
  min_duration_seconds: 3
  max_duration_seconds: 90

roughcut:
  enabled: true
  max_clips: 5

ffmpeg_script:
  enabled: true
  output_format: mp4
  mode: stream-copy

report:
  enabled: true

models:
  enabled: false

  entries:
    local_qwen:
      provider: ollama
      model: qwen2.5:7b
      role: expander
      base_url: http://localhost:11434
      options:
        temperature: 0.2

    premium_reasoner:
      provider: openai
      model: gpt-4.1
      role: reasoner
      api_key_env: OPENAI_API_KEY
      options:
        temperature: 0.1
        max_tokens: 1200

  routes:
    highlight_reasoning: premium_reasoner
    goal_reranking: local_qwen
    caption_expansion: local_qwen
    timeline_labeling: local_qwen
    verification: premium_reasoner

tools:
  enabled: false

  backends:
    local_writer:
      kind: text_generation
      provider: ollama
      model: qwen2.5:7b
      endpoint: http://localhost:11434
      auth:
        type: none
      options:
        temperature: 0.2

    voice_backend:
      kind: voice_generation
      provider: elevenlabs-compatible
      model: voice-model-name
      endpoint: https://api.example.com
      auth:
        type: header_env
        header: xi-api-key
        env: ELEVENLABS_API_KEY

    custom_video_backend:
      kind: video_generation
      provider: custom-http
      model: video-model-name
      endpoint: https://example.com/generate
      auth:
        type: bearer_env
        env: VIDEO_API_KEY
      request_template: video_generation_v1
      response_mapping:
        output_url: $.data.video_url
        job_id: $.data.job_id

  routes:
    creative.script: local_writer
    creative.voiceover: voice_backend
    creative.video_broll: custom_video_backend
    creative.captions: local_writer
